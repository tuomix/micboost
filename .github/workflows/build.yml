name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  core-tests-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Test MicBoost.Core (DSP, settings) on Linux
        run: dotnet test tests/MicBoost.Core.Tests -c Release

  windows:
    name: Build, test and package (Windows)
    runs-on: windows-latest
    permissions:
      contents: write # only used to publish a GitHub Release for v* tags
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          $number = ($v -split '-')[0]
          "version=$v" >> $env:GITHUB_OUTPUT
          "number=$number" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Restore
        run: dotnet restore MicBoost.sln

      - name: Build
        run: dotnet build MicBoost.sln -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Test
        run: dotnet test tests/MicBoost.Core.Tests -c Release --no-build

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/MicBoost.App/MicBoost.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found" }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.number }}" "/DSourceExe=..\publish\MicBoost.exe" installer\MicBoost.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Package and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item installer\Output\MicBoost-Setup.exe dist\
          Compress-Archive -Path publish\MicBoost.exe, LICENSE, README.md -DestinationPath dist\MicBoost-portable.zip
          $lines = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [System.IO.File]::WriteAllLines("$PWD\dist\SHA256SUMS.txt", $lines)
          Get-Content dist\SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: MicBoost-${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/MicBoost-Setup.exe dist/MicBoost-portable.zip dist/SHA256SUMS.txt `
            --title "MicBoost $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
